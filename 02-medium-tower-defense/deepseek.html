<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tower Defence</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a2026;
    color: #e8eef4;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  #wrap { display: flex; gap: 18px; align-items: flex-start; }
  #game {
    background: #2a333d;
    padding: 14px;
    border-radius: 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  canvas#board { display: block; border: 2px solid #3d4855; border-radius: 4px; }
  #hud {
    display: flex; gap: 18px; align-items: center;
    background: #242c35; padding: 8px 14px; border-radius: 6px;
    margin-bottom: 10px; font-weight: 600;
  }
  .hud-item span { color: #ffd76a; }
  #lives span { color: #ff7a7a; }
  #wave span { color: #7ad0ff; }
  button {
    background: #3b4653; color: #e8eef4; border: 1px solid #4d5a6a;
    padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: 600;
  }
  button:hover { background: #4a5768; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #panel {
    width: 170px; background: #242c35; padding: 12px; border-radius: 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  #panel h3 { font-size: 14px; margin-bottom: 10px; text-align: center; color: #ffd76a; }
  .tower-opt {
    display: block; width: 100%; text-align: left; padding: 8px 10px;
    margin-bottom: 8px; border: 1px solid #4d5a6a; border-radius: 6px;
    background: #333d49; cursor: pointer; font-size: 13px; line-height: 1.3;
  }
  .tower-opt:hover { background: #414d5c; }
  .tower-opt.active { border-color: #ffd76a; background: #47546a; }
  .tower-opt .tname { font-weight: 700; }
  .tower-opt .cost { color: #ffd76a; }
  .tower-opt .desc { color: #aab6c4; font-size: 11px; }
  #info { margin-top: 14px; border-top: 1px solid #3d4855; padding-top: 10px; font-size: 12px; color: #aab6c4; line-height: 1.6; }
  #info b { color: #e8eef4; }
  #speedbtn { background: #2f8b57; }
  #speedbtn:hover { background: #37a066; }
  #endoverlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.7);
    display: none; align-items: center; justify-content: center;
  }
  #endcard {
    background: #2a333d; padding: 30px 44px; border-radius: 12px; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.6);
  }
  #endcard h2 { margin-bottom: 8px; }
  #endcard p { margin-bottom: 18px; color: #aab6c4; }
</style>
</head>
<body>
<div id="wrap">
  <div id="game">
    <div id="hud">
      <div class="hud-item">💰 Gold: <span id="gold">150</span></div>
      <div class="hud-item" id="lives">❤️ Lives: <span id="livesVal">20</span></div>
      <div class="hud-item" id="wave">🌊 Wave: <span id="waveVal">0</span>/20</div>
      <button id="sendBtn">Send Wave</button>
      <button id="speedBtn">1x</button>
      <button id="pauseBtn">Pause</button>
    </div>
    <canvas id="board" width="960" height="600"></canvas>
  </div>
  <div id="panel">
    <h3>Select Tower</h3>
    <button class="tower-opt" data-type="archer">
      <div class="tname">🏹 Archer <span class="cost">50g</span></div>
      <div class="desc">Fast, single-target</div>
    </button>
    <button class="tower-opt" data-type="cannon">
      <div class="tname">💣 Cannon <span class="cost">90g</span></div>
      <div class="desc">Slow, splash damage</div>
    </button>
    <button class="tower-opt" data-type="frost">
      <div class="tname">❄️ Frost <span class="cost">70g</span></div>
      <div class="desc">Slows enemies</div>
    </button>
    <button class="tower-opt" data-type="sniper">
      <div class="tname">🎯 Sniper <span class="cost">130g</span></div>
      <div class="desc">Long range, high dmg</div>
    </button>
    <div id="info">
      <b>Placing:</b> pick a tower, then click a grass cell.<br>
      <b>Selected tower:</b> shows range. Buttons below to upgrade or sell.<br>
      <span id="selInfo">No tower selected.</span>
    </div>
    <div style="margin-top:10px; display:flex; gap:8px;">
      <button id="upgradeBtn" disabled>⬆ Upgrade</button>
      <button id="sellBtn" disabled>Sell</button>
    </div>
  </div>
</div>
<div id="endoverlay">
  <div id="endcard">
    <h2 id="endTitle"></h2>
    <p id="endMsg"></p>
    <button id="restartBtn">Play Again</button>
  </div>
</div>

<script>
(function () {
  "use strict";
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const CELL = 40;
  const COLS = canvas.width / CELL; // 24
  const ROWS = canvas.height / CELL; // 15

  // ---------- PATH ----------
  // Define a winding path from left edge to right edge using grid waypoints (in cells).
  // We'll build path as a polyline of waypoint coordinates (pixels, cell centers).
  const waypoints = [
    {x:-1, y:2},
    {x:7,  y:2},
    {x:7,  y:7},
    {x:16, y:7},
    {x:16, y:3},
    {x:23, y:3},
    {x:23, y:11},
    {x:12, y:11},
    {x:12, y:8},
    {x:6,  y:8},
    {x:6,  y:13},
    {x:25, y:13}
  ];
  const path = waypoints.map(w => ({ x: w.x * CELL + CELL/2, y: w.y * CELL + CELL/2 }));

  // Compute path cells for blocking tower placement.
  const pathCells = new Set();
  for (let i = 0; i < waypoints.length - 1; i++) {
    const a = waypoints[i], b = waypoints[i+1];
    const cx = Math.round(a.x + (b.x-a.x)/2);
    const cy = Math.round(a.y + (b.y-a.y)/2);
    // Traverse axis-aligned segment
    let x = a.x, y = a.y;
    const steps = Math.abs(b.x-a.x) + Math.abs(b.y-a.y);
    const sx = Math.sign(b.x-a.x), sy = Math.sign(b.y-a.y);
    for (let s = 0; s <= steps; s++) {
      pathCells.add(x + ',' + y);
      x += sx; y += sy;
    }
  }

  // ---------- STATE ----------
  let gold = 150;
  let lives = 20;
  let wave = 0;
  let totalWaves = 20;
  let gameOver = false;
  let victory = false;
  let paused = false;
  let speed = 1;
  let time = 0;

  let selectedTowerType = null;
  let selectedTower = null; // tower object placed

  let towers = [];
  let enemies = [];
  let projectiles = [];
  let spawnQueue = [];
  let spawnTimer = 0;
  let waveInProgress = false;
  let waveBonusPending = false;

  // ---------- TOWER DEFINITIONS ----------
  const TOWER_DEFS = {
    archer: { name:'Archer', cost:50, range:120, fireRate:0.6, damage:14, color:'#5aa84f', type:'archer' },
    cannon: { name:'Cannon', cost:90, range:100, fireRate:1.6, damage:30, splash:42, color:'#8a5a2b', type:'cannon' },
    frost:  { name:'Frost', cost:70, range:110, fireRate:0.9, damage:6, slow:0.45, slowDur:1.8, color:'#4fb6c9', type:'frost' },
    sniper: { name:'Sniper', cost:130, range:230, fireRate:2.2, damage:85, color:'#b04fb0', type:'sniper' }
  };
  const UPGRADE_COST = [50, 80, 120]; // cost to upgrade to level 2,3,4
  const UPGRADE_MULT = [1.35, 1.3, 1.25]; // stat multiplier per level
  const SELL_RATIO = 0.7;

  // ---------- ENEMY DEFINITIONS ----------
  const ENEMY_DEFS = {
    basic:  { hp: 60,  speed: 55, reward: 8,  color:'#e25c5c', radius: 12 },
    fast:   { hp: 35,  speed: 100, reward: 10, color:'#e0a53d', radius: 9 },
    tank:   { hp: 200, speed: 38, reward: 18, color:'#6b6b8a', radius: 15 },
    boss:   { hp: 1400, speed: 30, reward: 100, color:'#c039c0', radius: 20 }
  };

  // ---------- UI ELEMENTS ----------
  const goldEl = document.getElementById('gold');
  const livesEl = document.getElementById('livesVal');
  const waveEl = document.getElementById('waveVal');
  const sendBtn = document.getElementById('sendBtn');
  const speedBtn = document.getElementById('speedBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const upgradeBtn = document.getElementById('upgradeBtn');
  const sellBtn = document.getElementById('sellBtn');
  const selInfo = document.getElementById('selInfo');
  const overlay = document.getElementById('endoverlay');
  const endTitle = document.getElementById('endTitle');
  const endMsg = document.getElementById('endMsg');
  const restartBtn = document.getElementById('restartBtn');

  // ---------- HELPERS ----------
  function updateHUD() {
    goldEl.textContent = gold;
    livesEl.textContent = lives;
    waveEl.textContent = wave;
    sendBtn.disabled = waveInProgress || gameOver || victory;
  }

  function dist(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  function isPathCell(cx, cy) {
    return pathCells.has(cx + ',' + cy);
  }

  function isOccupied(cx, cy) {
    return towers.some(t => t.cx === cx && t.cy === cy);
  }

  function cellCenter(cx, cy) {
    return { x: cx * CELL + CELL/2, y: cy * CELL + CELL/2 };
  }

  // ---------- SPAWN LOGIC ----------
  function buildWave(n) {
    const queue = [];
    const base = 0.9 * Math.pow(n, 1.25);
    // basic
    for (let i = 0; i < Math.round(4 + base); i++) queue.push('basic');
    // fast from wave 2
    if (n >= 2) for (let i = 0; i < Math.round(2 + base*0.6); i++) queue.push('fast');
    // tank from wave 3
    if (n >= 3) for (let i = 0; i < Math.round(1 + base*0.4); i++) queue.push('tank');
    // boss every 5 waves
    if (n % 5 === 0) queue.push('boss');
    // shuffle loosely
    for (let i = queue.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [queue[i], queue[j]] = [queue[j], queue[i]];
    }
    return queue;
  }

  function spawnEnemy(type) {
    const def = ENEMY_DEFS[type];
    const hpScale = 1 + (wave - 1) * 0.12 + (type === 'boss' ? 0 : 0);
    const spScale = 1 + (wave - 1) * 0.02;
    enemies.push({
      type: type,
      x: path[0].x, y: path[0].y,
      hp: Math.round(def.hp * hpScale),
      maxHp: Math.round(def.hp * hpScale),
      speed: def.speed * spScale,
      reward: def.reward,
      color: def.color,
      radius: def.radius,
      pathIndex: 1,
      slowUntil: 0,
      slowFactor: 1
    });
  }

  function startWave() {
    wave++;
    spawnQueue = buildWave(wave);
    spawnTimer = 0;
    waveInProgress = true;
    updateHUD();
  }

  // ---------- TOWERS ----------
  function placeTower(cx, cy) {
    if (!selectedTowerType) return;
    if (isPathCell(cx, cy) || isOccupied(cx, cy)) return;
    const def = TOWER_DEFS[selectedTowerType];
    if (gold < def.cost) return;
    gold -= def.cost;
    const c = cellCenter(cx, cy);
    const tower = {
      cx: cx, cy: cy, x: c.x, y: c.y,
      type: def.type, level: 1,
      damage: def.damage, range: def.range, fireRate: def.fireRate,
      splash: def.splash || 0,
      slow: def.slow || 0, slowDur: def.slowDur || 0,
      color: def.color, cooldown: 0,
      totalSpent: def.cost,
      angle: 0
    };
    towers.push(tower);
    selectedTower = tower;
    updateHUD();
    updatePanel();
  }

  function upgradeTower(t) {
    if (t.level >= 4) return;
    const cost = UPGRADE_COST[t.level - 1];
    if (gold < cost) return;
    gold -= cost;
    const mult = UPGRADE_MULT[t.level - 1];
    t.damage *= mult;
    t.range *= mult;
    t.fireRate *= 0.9;
    if (t.splash) t.splash *= mult;
    t.level++;
    t.totalSpent += cost;
    updateHUD();
    updatePanel();
  }

  function sellTower(t) {
    const refund = Math.round(t.totalSpent * SELL_RATIO);
    gold += refund;
    towers = towers.filter(x => x !== t);
    selectedTower = null;
    updateHUD();
    updatePanel();
  }

  function updatePanel() {
    if (selectedTower) {
      const t = selectedTower;
      selInfo.innerHTML = `${TOWER_DEFS[t.type].name} (lvl ${t.level})<br>Dmg ${Math.round(t.damage)}, Range ${Math.round(t.range)}<br>Refund ${Math.round(t.totalSpent*SELL_RATIO)}g`;
      upgradeBtn.disabled = t.level >= 4 || gameOver || victory;
      upgradeBtn.textContent = t.level >= 4 ? 'Max level' : `⬆ Upgrade (${UPGRADE_COST[t.level-1]}g)`;
      sellBtn.disabled = gameOver || victory;
      sellBtn.textContent = `Sell (${Math.round(t.totalSpent*SELL_RATIO)}g)`;
    } else {
      selInfo.textContent = 'No tower selected.';
      upgradeBtn.disabled = true;
      sellBtn.disabled = true;
      upgradeBtn.textContent = '⬆ Upgrade';
      sellBtn.textContent = 'Sell';
    }
  }

  // ---------- PROJECTILES ----------
  function fireProjectile(tower, target) {
    const isCannon = tower.type === 'cannon';
    const isFrost = tower.type === 'frost';
    projectiles.push({
      x: tower.x, y: tower.y - 6,
      target: target,
      speed: isCannon ? 260 : (isFrost ? 420 : 480),
      damage: tower.damage,
      type: tower.type,
      splash: tower.splash || 0,
      slow: tower.slow || 0,
      slowDur: tower.slowDur || 0,
      color: tower.color,
      hit: false
    });
  }

  function applyDamage(enemy, dmg) {
    enemy.hp -= dmg;
    if (enemy.hp <= 0 && !enemy.dead) {
      enemy.dead = true;
      gold += enemy.reward;
      updateHUD();
    }
  }

  // ---------- UPDATE ----------
  function update(dt) {
    if (gameOver || victory || paused) return;
    time += dt;

    // spawning
    if (waveInProgress && spawnQueue.length > 0) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnEnemy(spawnQueue.shift());
        spawnTimer = Math.max(0.12, 0.6 - wave * 0.012);
      }
    }

    // enemies move
    for (const e of enemies) {
      if (e.dead) continue;
      const slowed = e.slowUntil > time;
      const factor = slowed ? e.slowFactor : 1;
      const speed = e.speed * factor;
      // move along path
      let remaining = speed * dt;
      let guard = 0;
      while (remaining > 0 && guard < 50) {
        guard++;
        const wp = path[e.pathIndex];
        const d = dist(e, wp);
        if (d <= remaining) {
          e.x = wp.x; e.y = wp.y;
          remaining -= d;
          e.pathIndex++;
          if (e.pathIndex >= path.length) {
            // reached end
            lives--;
            e.dead = true;
            if (lives <= 0) {
              lives = 0;
              gameOver = true;
            }
            remaining = 0;
            updateHUD();
            break;
          }
        } else {
          e.x += ((wp.x - e.x) / d) * remaining;
          e.y += ((wp.y - e.y) / d) * remaining;
          remaining = 0;
        }
      }
    }
    enemies = enemies.filter(e => !e.dead);

    // towers fire
    for (const t of towers) {
      t.cooldown -= dt;
      if (t.cooldown <= 0) {
        // find target: first enemy in range that hasn't reached end; prioritize farther along path
        let target = null, bestIdx = -1;
        for (const e of enemies) {
          if (e.dead) continue;
          if (dist(t, e) <= t.range && e.pathIndex > bestIdx) {
            bestIdx = e.pathIndex;
            target = e;
          }
        }
        if (target) {
          t.angle = Math.atan2(target.y - t.y, target.x - t.x);
          fireProjectile(t, target);
          t.cooldown = t.fireRate;
        }
      }
    }

    // projectiles move
    for (const p of projectiles) {
      if (p.hit) continue;
      if (!p.target || p.target.dead) { p.hit = true; continue; }
      const d = dist(p, p.target);
      const step = p.speed * dt;
      if (d <= step || d < 2) {
        p.x = p.target.x; p.y = p.target.y;
        p.hit = true;
        if (p.splash > 0) {
          // splash: damage all enemies within radius
          for (const e of enemies) {
            if (e.dead) continue;
            if (dist(p, e) <= p.splash) {
              applyDamage(e, p.damage);
            }
          }
        } else {
          applyDamage(p.target, p.damage);
        }
        if (p.slow > 0) {
          for (const e of enemies) {
            if (e.dead) continue;
            if (dist(p, e) <= p.splash + 4) {
              e.slowUntil = time + p.slowDur;
              e.slowFactor = 1 - p.slow;
            }
          }
        }
      } else {
        p.x += ((p.target.x - p.x) / d) * step;
        p.y += ((p.target.y - p.y) / d) * step;
      }
    }
    projectiles = projectiles.filter(p => !p.hit);

    // wave completion check
    if (waveInProgress && spawnQueue.length === 0 && enemies.length === 0) {
      waveInProgress = false;
      const bonus = 25 + wave * 5;
      gold += bonus;
      if (wave >= totalWaves) {
        victory = true;
        showEnd(true);
      }
      updateHUD();
    }

    if (gameOver) showEnd(false);
  }

  // ---------- DRAW ----------
  function draw() {
    // background
    ctx.fillStyle = '#1f3a24';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // grid grass
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, canvas.height); ctx.stroke();
    }
    for (let j = 0; j <= ROWS; j++) {
      ctx.beginPath(); ctx.moveTo(0, j*CELL); ctx.lineTo(canvas.width, j*CELL); ctx.stroke();
    }

    // path
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#8a6a3a';
    ctx.lineWidth = CELL - 4;
    ctx.beginPath();
    ctx.moveTo(path[0].x, path[0].y);
    for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
    ctx.stroke();
    // path border
    ctx.strokeStyle = '#5d4626';
    ctx.lineWidth = CELL;
    ctx.stroke();

    // towers
    for (const t of towers) drawTower(t);

    // enemies
    for (const e of enemies) {
      if (e.dead) continue;
      // body
      ctx.fillStyle = e.color;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 2;
      ctx.stroke();
      if (e.slowUntil > time) {
        ctx.fillStyle = 'rgba(120,220,255,0.5)';
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius+3, 0, Math.PI*2);
        ctx.fill();
      }
      // health bar
      const bw = e.radius * 2.2;
      const bh = 4;
      const bx = e.x - bw/2;
      const by = e.y - e.radius - 10;
      ctx.fillStyle = '#333';
      ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = e.hp / e.maxHp > 0.5 ? '#4fae4f' : (e.hp/e.maxHp > 0.25 ? '#d9a63d' : '#d94f4f');
      ctx.fillRect(bx, by, bw * Math.max(0, e.hp / e.maxHp), bh);
    }

    // projectiles
    for (const p of projectiles) {
      if (p.hit) continue;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.type === 'cannon' ? 6 : 4, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath();
      ctx.arc(p.x-1, p.y-1, p.type === 'cannon' ? 2 : 1.5, 0, Math.PI*2);
      ctx.fill();
    }

    // selection / placement range
    const showTower = selectedTower || (selectedTowerType ? { x: hoverX, y: hoverY, range: TOWER_DEFS[selectedTowerType].range } : null);
    if (showTower && showTower.x !== undefined) {
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(showTower.x, showTower.y, showTower.range, 0, Math.PI*2);
      ctx.fill();
      ctx.stroke();
    }

    // placement ghost
    if (selectedTowerType && hoverCell) {
      const valid = !isPathCell(hoverCell.cx, hoverCell.cy) && !isOccupied(hoverCell.cx, hoverCell.cy) && gold >= TOWER_DEFS[selectedTowerType].cost;
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = valid ? TOWER_DEFS[selectedTowerType].color : '#d94f4f';
      ctx.fillRect(hoverCell.cx*CELL+4, hoverCell.cy*CELL+4, CELL-8, CELL-8);
      ctx.globalAlpha = 1;
    }
  }

  function drawTower(t) {
    const cx = t.x, cy = t.y;
    // base
    ctx.fillStyle = '#c8ccd2';
    ctx.fillRect(cx-CELL/2+3, cy-CELL/2+3, CELL-6, CELL-6);
    ctx.strokeStyle = '#8a9098';
    ctx.lineWidth = 2;
    ctx.strokeRect(cx-CELL/2+3, cy-CELL/2+3, CELL-6, CELL-6);
    // turret
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(t.angle);
    ctx.fillStyle = t.color;
    ctx.fillRect(-6, -6, 16, 12);
    ctx.restore();
    // center dot
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(cx, cy, 4, 0, Math.PI*2);
    ctx.fill();
    // level pips
    for (let i = 0; i < t.level - 1; i++) {
      ctx.fillStyle = '#ffd76a';
      ctx.beginPath();
      ctx.arc(cx - (t.level-1)*5/2 + i*5, cy - CELL/2 + 8, 2, 0, Math.PI*2);
      ctx.fill();
    }
  }

  // ---------- HOVER ----------
  let hoverX = -1000, hoverY = -1000;
  let hoverCell = null;

  // ---------- EVENTS ----------
  function mouseToCell(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;
    return { cx: Math.floor(mx/CELL), cy: Math.floor(my/CELL) };
  }

  canvas.addEventListener('mousemove', (e) => {
    const c = mouseToCell(e);
    hoverCell = c;
    hoverX = c.cx*CELL + CELL/2;
    hoverY = c.cy*CELL + CELL/2;
  });

  canvas.addEventListener('mouseleave', () => {
    hoverCell = null;
    hoverX = -1000; hoverY = -1000;
  });

  canvas.addEventListener('click', (e) => {
    if (gameOver || victory) return;
    const c = mouseToCell(e);
    if (c.cx < 0 || c.cx >= COLS || c.cy < 0 || c.cy >= ROWS) return;
    // if a tower is here, select it
    const towerHere = towers.find(t => t.cx === c.cx && t.cy === c.cy);
    if (towerHere) {
      selectedTower = towerHere;
      selectedTowerType = null;
      updatePanel();
      return;
    }
    if (selectedTowerType) {
      placeTower(c.cx, c.cy);
    }
  });

  // tower panel buttons
  document.querySelectorAll('.tower-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      if (gameOver || victory) return;
      const type = btn.dataset.type;
      if (selectedTowerType === type) {
        selectedTowerType = null;
      } else {
        selectedTowerType = type;
        selectedTower = null;
      }
      document.querySelectorAll('.tower-opt').forEach(b => b.classList.toggle('active', b.dataset.type === selectedTowerType));
      updatePanel();
    });
  });

  upgradeBtn.addEventListener('click', () => {
    if (selectedTower) upgradeTower(selectedTower);
  });
  sellBtn.addEventListener('click', () => {
    if (selectedTower) sellTower(selectedTower);
  });

  sendBtn.addEventListener('click', () => {
    if (!waveInProgress && !gameOver && !victory) startWave();
  });

  speedBtn.addEventListener('click', () => {
    speed = speed === 1 ? 2 : 1;
    speedBtn.textContent = speed + 'x';
    speedBtn.style.background = speed === 2 ? '#b0602f' : '#2f8b57';
  });

  pauseBtn.addEventListener('click', () => {
    paused = !paused;
    pauseBtn.textContent = paused ? 'Resume' : 'Pause';
  });

  restartBtn.addEventListener('click', () => {
    location.reload();
  });

  // ---------- END ----------
  function showEnd(victoryFlag) {
    if (endShown) return;
    endShown = true;
    overlay.style.display = 'flex';
    if (victoryFlag) {
      endTitle.textContent = '🎉 Victory!';
      endMsg.textContent = 'You cleared all 20 waves!';
    } else {
      endTitle.textContent = '💀 Game Over';
      endMsg.textContent = 'You lost all your lives.';
    }
  }
  let endShown = false;

  // ---------- MAIN LOOP ----------
  let lastTime = performance.now();
  function loop(now) {
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.05) dt = 0.05;
    if (!paused) {
      update(dt * speed);
    }
    draw();
    requestAnimationFrame(loop);
  }

  updateHUD();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
