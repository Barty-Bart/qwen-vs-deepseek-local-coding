<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tower Defense</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #10141c;
    color: #dfe6f0;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 16px;
    user-select: none;
  }
  h1 { font-size: 20px; margin-bottom: 10px; letter-spacing: 1px; color: #9fc3ff; }
  #game {
    display: flex; gap: 12px; align-items: flex-start;
  }
  canvas#board {
    background: #1a2230;
    border: 2px solid #31415c;
    border-radius: 6px;
    display: block;
    cursor: crosshair;
  }
  #side {
    width: 230px;
    background: #171e2b;
    border: 2px solid #31415c;
    border-radius: 6px;
    padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .panelTitle { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #7d8ba3; margin-bottom: 2px; }
  .towerBtn {
    display: flex; align-items: center; gap: 8px;
    background: #212b3d; border: 2px solid #31415c; border-radius: 6px;
    padding: 8px; cursor: pointer; text-align: left; color: #dfe6f0;
    font-family: inherit; font-size: 13px;
  }
  .towerBtn:hover { border-color: #4a628f; }
  .towerBtn.selected { border-color: #ffd24d; background: #2b3550; }
  .towerBtn.disabled { opacity: 0.45; cursor: not-allowed; }
  .towerIcon {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex: none;
  }
  .towerBtn .cost { margin-left: auto; color: #ffd24d; font-weight: 600; }
  .desc { font-size: 11px; color: #7d8ba3; margin-top: 2px; }
  #info {
    background: #212b3d; border: 1px solid #31415c; border-radius: 6px;
    padding: 8px; font-size: 12px; min-height: 118px;
  }
  #info .name { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
  #info .row { color: #9fb0c9; }
  .infoBtn {
    margin-top: 6px; padding: 6px; border-radius: 5px; border: none;
    cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600;
  }
  #upgradeBtn { background: #2e7d46; color: #eafff0; }
  #upgradeBtn:disabled { background: #33405a; color: #7d8ba3; cursor: not-allowed; }
  #sellBtn { background: #8a3b3b; color: #ffe6e6; }
  #controls { display: flex; gap: 8px; }
  #controls button {
    flex: 1; padding: 10px 4px; font-family: inherit; font-size: 13px; font-weight: 700;
    border: none; border-radius: 6px; cursor: pointer;
  }
  #sendWaveBtn { background: #2e7d46; color: #eafff0; }
  #sendWaveBtn:disabled { background: #33405a; color: #7d8ba3; cursor: not-allowed; }
  #speedBtn { background: #3b4d7a; color: #dfe6f0; width: 60px; flex: none !important; }
  #pauseBtn { background: #5a4a1f; color: #ffe9b0; width: 70px; flex: none !important; }
  #bottomBar { display: flex; gap: 10px; margin-top: 12px; }
  .stat {
    background: #171e2b; border: 2px solid #31415c; border-radius: 6px;
    padding: 8px 18px; font-size: 14px; font-weight: 700;
  }
  .stat .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #7d8ba3; display: block; font-weight: 400; }
  #goldV { color: #ffd24d; }
  #livesV { color: #ff7a7a; }
  #waveV { color: #7ec8ff; }
  #msg { font-size: 12px; color: #9fb0c9; min-height: 16px; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<h1>🏰 TOWER DEFENSE</h1>
<div id="bottomBar">
  <div class="stat"><span class="lbl">Gold</span><span id="goldV">150</span></div>
  <div class="stat"><span class="lbl">Lives</span><span id="livesV">20</span></div>
  <div class="stat"><span class="lbl">Wave</span><span id="waveV">0 / 20</span></div>
</div>
<div id="game">
  <canvas id="board" width="960" height="600"></canvas>
  <div id="side">
    <div class="panelTitle">Build Towers</div>
    <button class="towerBtn" data-t="archer">
      <span class="towerIcon" style="background:#4f8f4f;">➶</span>
      <span>Archer<div class="desc">Cheap, fast, single target</div></span>
      <span class="cost">50g</span>
    </button>
    <button class="towerBtn" data-t="cannon">
      <span class="towerIcon" style="background:#a06a2f;">●</span>
      <span>Cannon<div class="desc">Slow, splash damage</div></span>
      <span class="cost">80g</span>
    </button>
    <button class="towerBtn" data-t="frost">
      <span class="towerIcon" style="background:#3f8fae;">❄</span>
      <span>Frost<div class="desc">Slows enemies in range</div></span>
      <span class="cost">60g</span>
    </button>
    <button class="towerBtn" data-t="sniper">
      <span class="towerIcon" style="background:#7a4fa0;">✛</span>
      <span>Sniper<div class="desc">Long range, high damage</div></span>
      <span class="cost">100g</span>
    </button>
    <div class="panelTitle" style="margin-top:6px;">Selected Tower</div>
    <div id="info">Click on a placed tower to see its stats.</div>
    <div id="controls" style="margin-top:auto;">
      <button id="sendWaveBtn">Send Wave</button>
      <button id="speedBtn" title="Toggle game speed">1x</button>
      <button id="pauseBtn">Pause</button>
    </div>
  </div>
</div>
<div id="msg"></div>

<script>
"use strict";
// ---------- Setup ----------
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const COLS = 24, ROWS = 15, CELL = 40;
const W = 960, H = 600;
const TOTAL_WAVES = 20;

// Winding path waypoints (cell coordinates: col 0..24, row 0..15)
const WP_CELLS = [
  {c:-1,r:2},{c:3,r:2},{c:3,r:7},{c:8,r:7},{c:8,r:2},{c:13,r:2},
  {c:13,r:11},{c:5,r:11},{c:5,r:13},{c:17,r:13},{c:17,r:5},{c:20,r:5},
  {c:20,r:9},{c:24,r:9}
];
const WAYPOINTS = WP_CELLS.map(w => ({x: w.c*CELL + CELL/2, y: w.r*CELL + CELL/2}));

// Build set of path cells
const pathCells = new Set();
for (let i = 0; i < WP_CELLS.length - 1; i++) {
  let a = WP_CELLS[i], b = WP_CELLS[i+1];
  if (a.r === b.r) {
    const c0 = Math.max(0, Math.min(a.c, b.c)), c1 = Math.min(COLS-1, Math.max(a.c, b.c));
    for (let c = c0; c <= c1; c++) pathCells.add(c + ',' + a.r);
  } else {
    const r0 = Math.max(0, Math.min(a.r, b.r)), r1 = Math.min(ROWS-1, Math.max(a.r, b.r));
    for (let r = r0; r <= r1; r++) pathCells.add(a.c + ',' + r);
  }
}

// ---------- Config ----------
const TOWER_TYPES = {
  archer: { name:'Archer', color:'#5fae5f', cost:50, range:110, rate:0.55, dmg:12 },
  cannon: { name:'Cannon', color:'#c98b3f', cost:80, range:95, rate:1.5, dmg:22, splash:55 },
  frost:  { name:'Frost',  color:'#54b8dc', cost:60, range:100, rate:0.8, dmg:5, slow:0.55, slowDur:1.2 },
  sniper: { name:'Sniper', color:'#9a6fd0', cost:100, range:220, rate:2.4, dmg:65 }
};
for (const k in TOWER_TYPES) TOWER_TYPES[k].levels = [{dmg:1},{dmg:1.6,cost:40},{dmg:2.4,cost:70},{dmg:3.5,cost:110}];

const ENEMY_TYPES = {
  runner: { hp:40,  speed:95, gold:8,  radius:9,  color:'#d05f8a', name:'Runner' },
  grunt:  { hp:80,  speed:50, gold:10, radius:11, color:'#8a9e3a', name:'Grunt' },
  tank:   { hp:220, speed:32, gold:20, radius:14, color:'#6a7fd0', name:'Tank' },
  boss:   { hp:1500,speed:26, gold:120,radius:19, color:'#c33a4a', name:'BOSS' }
};

// ---------- State ----------
let gold, lives, wave, towers, enemies, projectiles, effects, spawnQueue;
let waveActive, gameOver, victory, paused, speed, placingType, selectedTower, mouseCell;
let lastTime = 0;

function reset() {
  gold = 150; lives = 20; wave = 0;
  towers = []; enemies = []; projectiles = []; effects = [];
  spawnQueue = null; waveActive = false;
  gameOver = false; victory = false; paused = false; speed = 1;
  placingType = null; selectedTower = null; mouseCell = null;
  updateHud(); updateInfo(); updateButtons();
}

// ---------- Wave building ----------
function buildWave(n) {
  const q = [];
  let t = 0;
  const add = (type, count, gap) => { for (let i = 0; i < count; i++) { q.push({type, t}); t += gap; } };
  const isBossWave = n % 5 === 0;
  const hpMul = 1 + 0.16*(n-1);
  if (isBossWave) {
    add('grunt', 4 + Math.floor(n/3), 0.9);
    if (n >= 10) add('tank', Math.floor(n/5), 1.4);
    add('boss', 1, 3);
  } else {
    add('runner', 5 + n, 0.55);
    if (n >= 3) add('grunt', 2 + Math.floor(n*0.9), 0.9);
    if (n >= 6) add('tank', Math.floor(n/3), 1.4);
  }
  return { list: q, hpMul, time: 0 };
}

function startWave() {
  if (waveActive || wave >= TOTAL_WAVES || gameOver || victory) return;
  wave++;
  spawnQueue = buildWave(wave);
  waveActive = true;
  setMsg('Wave ' + wave + (wave % 5 === 0 ? ' — BOSS INCOMING!' : '') + ' incoming!');
  updateHud(); updateButtons();
}

// ---------- Enemies ----------
function spawnEnemy(type) {
  const def = ENEMY_TYPES[type];
  const hpMul = spawnQueue.hpMul * (type === 'boss' ? (1 + 0.25*Math.floor(wave/5)) : 1);
  const hp = Math.round(def.hp * hpMul);
  enemies.push({
    type, x: WAYPOINTS[0].x, y: WAYPOINTS[0].y,
    wp: 1, hp, maxHp: hp,
    speed: def.speed, baseSpeed: def.speed,
    radius: def.radius, color: def.color,
    gold: def.gold, slowT: 0, dead: false
  });
}

function moveEnemy(e, dt) {
  if (e.slowT > 0) { e.slowT -= dt; e.speed = e.baseSpeed * 0.5; }
  else e.speed = e.baseSpeed;
  let remaining = e.speed * dt;
  while (remaining > 0 && e.wp < WAYPOINTS.length) {
    const t = WAYPOINTS[e.wp];
    const dx = t.x - e.x, dy = t.y - e.y;
    const d = Math.hypot(dx, dy);
    if (d <= remaining) {
      e.x = t.x; e.y = t.y; e.wp++;
      remaining -= d;
    } else {
      e.x += dx / d * remaining;
      e.y += dy / d * remaining;
      remaining = 0;
    }
  }
  if (e.wp >= WAYPOINTS.length) {
    e.dead = true;
    lives -= e.type === 'boss' ? 5 : 1;
    addEffect({kind:'text', x: W-30, y: e.y, text: e.type==='boss' ? '-5' : '-1', color:'#ff6b6b', t: 1.2});
    if (lives <= 0) { lives = 0; gameOver = true; }
  }
}

// ---------- Towers ----------
function towerAt(c, r) { return towers.find(t => t.c === c && t.r === r); }

function towerDamage(tw) {
  const base = TOWER_TYPES[tw.type];
  return Math.round(base.dmg * base.levels[tw.level].dmg);
}
function towerStats(tw) {
  const base = TOWER_TYPES[tw.type];
  return {
    dmg: towerDamage(tw),
    range: base.range + tw.level * 12,
    rate: base.rate * Math.pow(0.92, tw.level)
  };
}
function upgradeCost(tw) {
  if (tw.level >= 3) return null;
  const base = TOWER_TYPES[tw.type];
  return base.levels[tw.level + 1].cost;
}

function placeTower(c, r, type) {
  const def = TOWER_TYPES[type];
  if (gold < def.cost) { setMsg('Not enough gold for ' + def.name + '.'); return; }
  gold -= def.cost;
  const tw = { type, c, r, x: c*CELL + CELL/2, y: r*CELL + CELL/2, level: 0, cd: 0, spent: def.cost, angle: 0 };
  towers.push(tw);
  addEffect({kind:'ring', x: tw.x, y: tw.y, t: 0.4, color: def.color});
  updateHud(); updateButtons();
  if (placingType && gold < TOWER_TYPES[placingType].cost) placingType = null, refreshSideButtons();
}

function updateTower(tw, dt) {
  tw.cd -= dt;
  const stats = towerStats(tw);
  // find target: furthest along path within range
  let target = null, best = -1;
  for (const e of enemies) {
    if (e.dead) continue;
    const d = Math.hypot(e.x - tw.x, e.y - tw.y);
    if (d <= stats.range) {
      const progress = e.wp * 10000 - Math.hypot(WAYPOINTS[Math.min(e.wp, WAYPOINTS.length-1)].x - e.x,
                                                 WAYPOINTS[Math.min(e.wp, WAYPOINTS.length-1)].y - e.y);
      if (progress > best) { best = progress; target = e; }
    }
  }
  if (target) tw.angle = Math.atan2(target.y - tw.y, target.x - tw.x);
  if (tw.cd <= 0 && target) {
    tw.cd = stats.rate;
    const typeDef = TOWER_TYPES[tw.type];
    projectiles.push({
      x: tw.x, y: tw.y - 8, target, speed: tw.type === 'sniper' ? 900 : tw.type === 'cannon' ? 380 : 560,
      dmg: stats.dmg, type: tw.type,
      splash: typeDef.splash || 0,
      slow: typeDef.slow || 0, slowDur: typeDef.slowDur || 0,
      color: typeDef.color, trail: tw.type === 'sniper'
    });
  }
}

// ---------- Projectiles ----------
function updateProjectile(p, dt) {
  if (p.target.dead) {
    // fizzle at last known position
    removeProj(p);
    return;
  }
  const dx = p.target.x - p.x, dy = p.target.y - p.y;
  const d = Math.hypot(dx, dy);
  const step = p.speed * dt;
  if (d <= step + p.target.radius) {
    // hit
    hitEnemy(p.target, p);
    if (p.splash > 0) {
      addEffect({kind:'boom', x: p.target.x, y: p.target.y, r: p.splash, t: 0.35});
      for (const e of enemies) {
        if (e !== p.target && !e.dead && Math.hypot(e.x - p.target.x, e.y - p.target.y) <= p.splash) {
          hitEnemy(e, p, 0.6);
        }
      }
    }
    if (p.slow > 0) {
      applySlow(p.target, p.slow, p.slowDur);
      addEffect({kind:'frost', x: p.target.x, y: p.target.y, t: 0.3});
    }
    removeProj(p);
  } else {
    p.x += dx / d * step;
    p.y += dy / d * step;
  }
}
function removeProj(p) { projectiles.splice(projectiles.indexOf(p), 1); }

function hitEnemy(e, p, mult = 1) {
  if (e.dead) return;
  e.hp -= p.dmg * mult;
  addEffect({kind:'spark', x: e.x, y: e.y, t: 0.2, color: p.color});
  if (e.hp <= 0) {
    e.dead = true;
    gold += e.gold;
    addEffect({kind:'text', x: e.x, y: e.y - 10, text: '+' + e.gold, color:'#ffd24d', t: 1});
    addEffect({kind:'death', x: e.x, y: e.y, r: e.radius, color: e.color, t: 0.4});
    updateHud();
  }
}

function applySlow(e, slow, dur) {
  e.slowT = Math.max(e.slowT, dur);
}

// ---------- Effects ----------
function addEffect(fx) { effects.push(fx); }
function updateEffects(dt) {
  for (let i = effects.length - 1; i >= 0; i--) {
    effects[i].t -= dt;
    if (effects[i].t <= 0) effects.splice(i, 1);
  }
}

// ---------- Main loop ----------
function frame(ts) {
  requestAnimationFrame(frame);
  if (!lastTime) lastTime = ts;
  let dt = (ts - lastTime) / 1000;
  lastTime = ts;
  if (dt > 0.1) dt = 0.1;
  if (!paused && !gameOver && !victory) {
    const steps = speed;
    for (let s = 0; s < steps; s++) step(dt);
  }
  render();
}

function step(dt) {
  // spawning
  if (spawnQueue) {
    spawnQueue.time += dt;
    let next = spawnQueue.list[0];
    while (next && next.t <= spawnQueue.time) {
      spawnEnemy(next.type);
      spawnQueue.list.shift();
      next = spawnQueue.list[0];
    }
    if (!spawnQueue.list.length) {
      if (enemies.length === 0) {
        // wave complete
        waveActive = false;
        spawnQueue = null;
        const bonus = 20 + wave * 5;
        gold += bonus;
        updateHud();
        if (wave >= TOTAL_WAVES) { victory = true; }
        else setMsg('Wave ' + wave + ' cleared! Bonus +' + bonus + ' gold. Send the next wave when ready.');
        updateButtons();
      }
    }
  }
  for (const e of enemies) if (!e.dead) moveEnemy(e, dt);
  enemies = enemies.filter(e => !e.dead);
  for (const tw of towers) updateTower(tw, dt);
  for (const p of [...projectiles]) updateProjectile(p, dt);
  updateEffects(dt);
}

// ---------- Rendering ----------
function render() {
  ctx.clearRect(0, 0, W, H);
  drawGrid();
  drawPath();
  drawRangePreview();
  for (const tw of towers) drawTower(tw);
  for (const e of enemies) drawEnemy(e);
  for (const p of projectiles) drawProjectile(p);
  drawEffects();
  if (paused) overlayText('PAUSED', '#ffd24d');
  if (gameOver) overlay('GAME OVER', '#ff5f5f', 'You lost all ' + 20 + ' lives. Refresh to play again.');
  if (victory) overlay('VICTORY!', '#6fe08a', 'All ' + TOTAL_WAVES + ' waves cleared with ' + lives + ' lives left. Well defended!');
}

function drawGrid() {
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let c = 1; c < COLS; c++) { ctx.moveTo(c*CELL + 0.5, 0); ctx.lineTo(c*CELL + 0.5, H); }
  for (let r = 1; r < ROWS; r++) { ctx.moveTo(0, r*CELL + 0.5); ctx.lineTo(W, r*CELL + 0.5); }
  ctx.stroke();
}

function drawPath() {
  // path body
  ctx.strokeStyle = '#3a3226';
  ctx.lineWidth = CELL - 6;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(WAYPOINTS[0].x, WAYPOINTS[0].y);
  for (let i = 1; i < WAYPOINTS.length; i++) ctx.lineTo(WAYPOINTS[i].x, WAYPOINTS[i].y);
  ctx.stroke();
  ctx.strokeStyle = '#57492f';
  ctx.lineWidth = CELL - 16;
  ctx.beginPath();
  ctx.moveTo(WAYPOINTS[0].x, WAYPOINTS[0].y);
  for (let i = 1; i < WAYPOINTS.length; i++) ctx.lineTo(WAYPOINTS[i].x, WAYPOINTS[i].y);
  ctx.stroke();
  // dashed center line
  ctx.strokeStyle = 'rgba(255,220,150,0.25)';
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 10]);
  ctx.beginPath();
  ctx.moveTo(WAYPOINTS[0].x, WAYPOINTS[0].y);
  for (let i = 1; i < WAYPOINTS.length; i++) ctx.lineTo(WAYPOINTS[i].x, WAYPOINTS[i].y);
  ctx.stroke();
  ctx.setLineDash([]);
  // entry / exit markers
  ctx.fillStyle = '#6fe08a';
  ctx.beginPath(); ctx.ellipse(6, WAYPOINTS[0].y, 5, 12, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ff5f5f';
  ctx.beginPath(); ctx.ellipse(W-6, WAYPOINTS[WAYPOINTS.length-1].y, 5, 12, 0, 0, Math.PI*2); ctx.fill();
}

function drawRangePreview() {
  if (placingType && mouseCell) {
    const {c, r} = mouseCell;
    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return;
    const def = TOWER_TYPES[placingType];
    const valid = !pathCells.has(c+','+r) && !towerAt(c, r);
    drawRange(c*CELL + CELL/2, r*CELL + CELL/2, def.range, valid ? '120,220,120' : '230,90,90');
    ctx.fillStyle = valid ? 'rgba(120,220,120,0.35)' : 'rgba(230,90,90,0.35)';
    ctx.fillRect(c*CELL, r*CELL, CELL, CELL);
  }
  if (selectedTower) {
    const s = towerStats(selectedTower);
    drawRange(selectedTower.x, selectedTower.y, s.range, '255,210,77');
    ctx.strokeStyle = '#ffd24d';
    ctx.lineWidth = 2;
    ctx.strokeRect(selectedTower.c*CELL + 2, selectedTower.r*CELL + 2, CELL - 4, CELL - 4);
  }
}

function drawRange(x, y, r, rgb) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(' + rgb + ',0.10)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(' + rgb + ',0.45)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function drawTower(tw) {
  const def = TOWER_TYPES[tw.type];
  ctx.save();
  ctx.translate(tw.x, tw.y);
  // base
  ctx.fillStyle = '#2b3550';
  ctx.strokeStyle = '#0f1420';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, 16, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  // turret
  ctx.rotate(tw.angle);
  ctx.fillStyle = def.color;
  if (tw.type === 'cannon') {
    ctx.fillRect(-4, -6, 20, 12);
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill();
  } else if (tw.type === 'sniper') {
    ctx.fillRect(-4, -3, 24, 6);
    ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(0, -10); ctx.lineTo(14, 0); ctx.lineTo(0, 10); ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
  // level pips
  if (tw.level > 0) {
    ctx.fillStyle = '#ffd24d';
    for (let i = 0; i < tw.level; i++) {
      ctx.beginPath();
      ctx.arc(tw.x - (tw.level-1) * 4 + i * 8, tw.y + 20, 2.5, 0, Math.PI*2);
      ctx.fill();
    }
  }
}

function drawEnemy(e) {
  // body
  ctx.beginPath();
  ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
  if (e.slowT > 0) ctx.fillStyle = mixColor(e.color, '#7ec8ff', 0.45);
  else ctx.fillStyle = e.color;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = e.slowT > 0 ? '#cdeeff' : 'rgba(0,0,0,0.4)';
  ctx.stroke();
  if (e.slowT > 0) {
    ctx.fillStyle = '#eaffff';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('❄', e.x, e.y - e.radius - 12);
  }
  if (e.type === 'boss') {
    ctx.fillStyle = '#ffd24d';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('★', e.x, e.y - e.radius - 8);
  }
  // health bar
  const wBar = e.radius * 2.2, hBar = 5;
  const x0 = e.x - wBar/2, y0 = e.y - e.radius - 9;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(x0 - 1, y0 - 1, wBar + 2, hBar + 2);
  ctx.fillStyle = '#402030';
  ctx.fillRect(x0, y0, wBar, hBar);
  const frac = Math.max(0, e.hp / e.maxHp);
  ctx.fillStyle = frac > 0.5 ? '#6fe08a' : frac > 0.25 ? '#ffd24d' : '#ff5f5f';
  ctx.fillRect(x0, y0, wBar * frac, hBar);
}

function mixColor(hex, hex2, t) {
  const p1 = parseInt(hex.slice(1), 16), p2 = parseInt(hex2.slice(1), 16);
  const r = Math.round(((p1>>16)&255)*(1-t) + ((p2>>16)&255)*t);
  const g = Math.round(((p1>>8)&255)*(1-t) + ((p2>>8)&255)*t);
  const b = Math.round((p1&255)*(1-t) + (p2&255)*t);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function drawProjectile(p) {
  if (p.trail) {
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p.x - (p.target.x - p.x) * 0.06, p.y - (p.target.y - p.y) * 0.06);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.type === 'cannon' ? 6 : 4, 0, Math.PI * 2);
  ctx.fillStyle = p.color;
  ctx.fill();
}

function drawEffects() {
  for (const f of effects) {
    if (f.kind === 'text') {
      f.y -= 0.5;
      ctx.globalAlpha = Math.min(1, f.t * 2);
      ctx.fillStyle = f.color;
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x, f.y);
      ctx.globalAlpha = 1;
    } else if (f.kind === 'boom') {
      const prog = 1 - f.t / 0.35;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * (0.4 + 0.6 * prog), 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,' + Math.round(150 + 80*prog) + ',60,' + (0.5 * (1-prog)) + ')';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,200,80,' + (0.8 * (1-prog)) + ')';
      ctx.lineWidth = 2;
      ctx.stroke();
    } else if (f.kind === 'death') {
      const prog = 1 - f.t / 0.4;
      ctx.globalAlpha = 1 - prog;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * (1 + prog * 1.5), 0, Math.PI * 2);
      ctx.strokeStyle = f.color;
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (f.kind === 'ring') {
      const prog = 1 - f.t / 0.4;
      ctx.beginPath();
      ctx.arc(f.x, f.y, 10 + prog * 24, 0, Math.PI * 2);
      ctx.strokeStyle = f.color;
      ctx.globalAlpha = 1 - prog;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (f.kind === 'frost') {
      ctx.globalAlpha = f.t / 0.3;
      ctx.beginPath();
      ctx.arc(f.x, f.y, 12, 0, Math.PI * 2);
      ctx.strokeStyle = '#cdeeff';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
}

function overlayText(text, color) {
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = color;
  ctx.font = 'bold 48px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(text, W/2, H/2 + 16);
}

function overlay(title, color, sub) {
  ctx.fillStyle = 'rgba(10,14,20,0.75)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = color;
  ctx.font = 'bold 56px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(title, W/2, H/2 - 10);
  ctx.fillStyle = '#dfe6f0';
  ctx.font = '18px sans-serif';
  ctx.fillText(sub, W/2, H/2 + 30);
}

// ---------- HUD & UI ----------
const goldEl = document.getElementById('goldV');
const livesEl = document.getElementById('livesV');
const waveEl = document.getElementById('waveV');
const msgEl = document.getElementById('msg');
const infoEl = document.getElementById('info');
const sendBtn = document.getElementById('sendWaveBtn');
const speedBtn = document.getElementById('speedBtn');
const pauseBtn = document.getElementById('pauseBtn');

function updateHud() {
  goldEl.textContent = gold;
  livesEl.textContent = lives;
  waveEl.textContent = wave + ' / ' + TOTAL_WAVES;
}
function setMsg(m) { msgEl.textContent = m; }

function updateButtons() {
  sendBtn.disabled = waveActive || gameOver || victory || wave >= TOTAL_WAVES;
  sendBtn.textContent = wave >= TOTAL_WAVES ? 'All waves sent' : (waveActive ? 'Wave in progress…' : 'Send Wave ' + (wave + 1));
}

function refreshSideButtons() {
  document.querySelectorAll('.towerBtn').forEach(btn => {
    const type = btn.dataset.t;
    btn.classList.toggle('selected', placingType === type);
    btn.classList.toggle('disabled', gold < TOWER_TYPES[type].cost);
  });
}

function updateInfo() {
  if (!selectedTower) {
    infoEl.innerHTML = 'Click on a placed tower to see its stats.<div class="desc" style="margin-top:6px;">Pick a tower above, then click a non-path cell to build it.</div>';
    return;
  }
  const tw = selectedTower;
  const def = TOWER_TYPES[tw.type];
  const s = towerStats(tw);
  const upCost = upgradeCost(tw);
  const sellVal = Math.round(tw.spent * 0.7);
  let html = '<div class="name" style="color:' + def.color + '">' + def.name + ' — Lv ' + (tw.level + 1) + '/4</div>';
  html += '<div class="row">Damage: <b>' + s.dmg + '</b></div>';
  html += '<div class="row">Range: <b>' + Math.round(s.range) + '</b></div>';
  html += '<div class="row">Fire rate: <b>' + s.rate.toFixed(2) + 's</b></div>';
  if (def.splash) html += '<div class="row">Splash radius: <b>' + def.splash + '</b></div>';
  if (def.slow) html += '<div class="row">Slow: <b>' + Math.round((1-def.slow)*100) + '%</b></div>';
  html += '<div class="row">Invested: ' + tw.spent + 'g → sell for <b style="color:#ffd24d">' + sellVal + 'g</b></div>';
  if (upCost !== null)
    html += '<button class="infoBtn" id="upgradeBtn">Upgrade (' + upCost + 'g)</button>';
  else
    html += '<button class="infoBtn" id="upgradeBtn" disabled>Max level</button>';
  html += '<button class="infoBtn" id="sellBtn" style="float:right">Sell +' + sellVal + 'g</button>';
  infoEl.innerHTML = html;
  const upB = document.getElementById('upgradeBtn');
  const sellB = document.getElementById('sellBtn');
  upB.disabled = upCost === null || gold < upCost;
  upB.onclick = () => {
    const cost = upgradeCost(tw);
    if (tw && cost !== null && gold >= cost) {
      gold -= cost;
      tw.spent += cost;
      tw.level++;
      addEffect({kind:'ring', x: tw.x, y: tw.y, t: 0.4, color:'#ffd24d'});
      updateHud(); updateInfo(); refreshSideButtons();
    }
  };
  sellB.onclick = () => {
    if (!tw) return;
    gold += Math.round(tw.spent * 0.7);
    towers.splice(towers.indexOf(tw), 1);
    selectedTower = null;
    addEffect({kind:'ring', x: tw.x, y: tw.y, t: 0.4, color:'#ff9f5f'});
    updateHud(); updateInfo(); refreshSideButtons();
  };
}

// ---------- Input ----------
canvas.addEventListener('mousemove', ev => {
  const rect = canvas.getBoundingClientRect();
  const mx = (ev.clientX - rect.left) * (W / rect.width);
  const my = (ev.clientY - rect.top) * (H / rect.height);
  mouseCell = { c: Math.floor(mx / CELL), r: Math.floor(my / CELL) };
});
canvas.addEventListener('mouseleave', () => { mouseCell = null; });
canvas.addEventListener('click', ev => {
  if (gameOver || victory) return;
  const rect = canvas.getBoundingClientRect();
  const mx = (ev.clientX - rect.left) * (W / rect.width);
  const my = (ev.clientY - rect.top) * (H / rect.height);
  const c = Math.floor(mx / CELL), r = Math.floor(my / CELL);
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return;
  const existing = towerAt(c, r);
  if (placingType) {
    if (pathCells.has(c + ',' + r)) { setMsg('Cannot build on the path!'); return; }
    if (existing) { setMsg('Cell is occupied — select that tower instead.'); return; }
    placeTower(c, r, placingType);
    refreshSideButtons();
  } else {
    selectedTower = existing || null;
    updateInfo();
  }
});
document.querySelectorAll('.towerBtn').forEach(btn => {
  btn.addEventListener('click', () => {
    const type = btn.dataset.t;
    if (gold < TOWER_TYPES[type].cost) { setMsg('Not enough gold for ' + TOWER_TYPES[type].name + '.'); return; }
    placingType = (placingType === type) ? null : type;
    selectedTower = null;
    updateInfo();
    refreshSideButtons();
  });
});
sendBtn.addEventListener('click', startWave);
speedBtn.addEventListener('click', () => {
  speed = speed === 1 ? 2 : 1;
  speedBtn.textContent = speed + 'x';
});
pauseBtn.addEventListener('click', () => {
  if (gameOver || victory) return;
  paused = !paused;
  pauseBtn.textContent = paused ? 'Resume' : 'Pause';
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'p' || ev.key === 'P') pauseBtn.click();
  if (ev.key === ' ') { ev.preventDefault(); sendBtn.click(); }
  if (ev.key === 'Escape') { placingType = null; selectedTower = null; refreshSideButtons(); updateInfo(); }
});

// ---------- Go ----------
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
